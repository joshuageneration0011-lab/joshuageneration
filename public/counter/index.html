<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Premium Tap Counter</title>
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 1.5rem calc(80px + env(safe-area-inset-bottom, 0px)) 1.5rem;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: manipulation;
    }

    /* Header/Footer Layout */
    header {
      text-align: center;
      margin-top: 1rem;
      z-index: 10;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #9ca3af;
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
    }

    /* Main Tappable Container */
    .tap-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 500px;
      position: relative;
      touch-action: manipulation;
    }

    /* Premium Glassmorphic Counter Button */
    .counter-btn {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 0 30px rgba(99, 102, 241, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
    }

    .counter-btn:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(99, 102, 241, 0.25),
        0 0 30px rgba(99, 102, 241, 0.1);
    }

    /* Click Active Scale Effect */
    .counter-btn.active {
      transform: scale(0.95);
    }

    /* Counter Text */
    .count-number {
      font-size: 5.5rem;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
      background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .count-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #818cf8;
      text-transform: uppercase;
    }

    /* Plus/Minus Controller Row */
    .controls-container {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-top: 2.5rem;
      z-index: 10;
    }

    .adjust-btn {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      color: #d1d5db;
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .adjust-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .adjust-btn:active {
      transform: scale(0.95);
    }

    /* Reset Button */
    .reset-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, 0.15);
      background: rgba(239, 68, 68, 0.05);
      color: #f87171;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .reset-btn:active {
      transform: scale(0.95);
    }

    /* Ripple Effect styling */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.3);
      transform: scale(0);
      animation: ripple-animation 0.5s ease-out;
      pointer-events: none;
    }

    @keyframes ripple-animation {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Floating +1 Pop Effect */
    .floating-bubble {
      position: absolute;
      color: #a5b4fc;
      font-weight: 800;
      font-size: 1.5rem;
      pointer-events: none;
      animation: float-up 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      text-shadow: 0 4px 10px rgba(99, 102, 241, 0.5);
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translateY(0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-100px) scale(1.3);
      }
    }

    /* Glow backdrop lights */
    .glow-bg {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(99, 102, 241, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Declaration Section Styling */
    .declaration-section {
      width: 100%;
      text-align: center;
      margin-bottom: 2rem;
      z-index: 10;
    }

    .declaration-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
      display: block;
    }

    .declaration-input-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
    }

    .declaration-input {
      width: 100%;
      max-width: 380px;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
      transition: all 0.3s;
      user-select: text;
      -webkit-user-select: text;
    }

    .declaration-input:focus {
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
    }

    .save-dec-btn {
      padding: 0.6rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      background: rgba(99, 102, 241, 0.1);
      color: #a5b4fc;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .save-dec-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .declaration-display-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }

    .declaration-text {
      font-size: 1.25rem;
      font-weight: 600;
      font-style: italic;
      color: #e0e7ff;
      max-width: 400px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
    }

    .edit-dec-btn {
      background: none;
      border: none;
      color: #818cf8;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      transition: color 0.2s;
    }

    .edit-dec-btn:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }

    /* Bottom Navigation Tab Bar (White) */
    .nav-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid rgba(229, 231, 235, 0.7);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.4rem 0.5rem 0.5rem 0.5rem;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
      padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
    }

    /* Keep it centered on larger screens like a device frame */
    @media (min-width: 640px) {
      .nav-container {
        max-width: 480px;
        margin: 0 auto;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 20px 20px 0 0;
        border-left: 1px solid rgba(229, 231, 235, 0.7);
        border-right: 1px solid rgba(229, 231, 235, 0.7);
      }
    }

    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #9ca3af; /* gray-400 */
      font-size: 10px;
      font-weight: 500;
      transition: color 0.2s ease;
      cursor: pointer;
      position: relative;
      padding: 0.2rem 0.4rem;
      gap: 0.15rem;
    }

    .nav-link:hover {
      color: #4b5563; /* gray-600 */
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      stroke-width: 2;
      color: #9ca3af;
      transition: color 0.2s ease;
    }

    .nav-link:hover .nav-icon {
      color: #4b5563;
    }

    /* Give Button with Gold Highlight circle */
    .nav-link-give {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      color: #d97706; /* Gold/Amber text */
      position: relative;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      gap: 0.15rem;
    }

    .give-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
      margin-top: -18px; /* Lift above the white bar */
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-link-give:hover .give-icon-wrapper {
      transform: scale(1.06);
      box-shadow: 0 6px 12px rgba(217, 119, 6, 0.4);
    }

    .nav-icon-give {
      width: 18px;
      height: 18px;
      color: #ffffff;
      stroke-width: 2.2;
    }

    /* Stats Section */
    .stats-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      max-width: 380px;
      margin-top: 2rem;
      z-index: 10;
    }

    .stat-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 0.85rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      border-color: rgba(99, 102, 241, 0.2);
      background: rgba(255, 255, 255, 0.04);
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.2rem;
      font-family: monospace;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- Glow Backdrop -->
  <div class="glow-bg"></div>

  <!-- Header -->
  <header>
    <h1>Tap Counter</h1>
  </header>

  <!-- Tap Button Container -->
  <div class="tap-container">
    <!-- Declaration Section -->
    <div id="declaration-section" class="declaration-section"></div>

    <div id="counter-btn" class="counter-btn">
      <span id="count-number" class="count-number">0</span>
      <span class="count-label">Tap to Count</span>
    </div>

    <!-- Quick Increment / Decrement Row -->
    <div class="controls-container">
      <button id="minus-btn" class="adjust-btn" title="Decrease by 1" aria-label="Minus 1">─</button>
      <button id="reset-btn" class="reset-btn">Reset</button>
      <button id="plus-btn" class="adjust-btn" title="Increase by 1" aria-label="Plus 1">┼</button>
    </div>

    <!-- Live Stats Counter Row -->
    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-value" id="stats-views">...</span>
        <span class="stat-label">Page Views</span>
      </div>
    </div>

    <!-- Quick Navigation -->
    <nav class="nav-container">
      <a href="/" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="/sermons" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
        Sermons
      </a>
      <a href="/books" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg>
        Books
      </a>
      <a href="/blog" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Blog
      </a>
      <a href="/donate" class="nav-link-give">
        <div class="give-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon-give"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5z"/></svg>
        </div>
        Give
      </a>
    </nav>
  </div>

  <script>
    // State
    let count = 0;
    let declaration = localStorage.getItem('tap_counter_declaration') || '';

    // Elements
    const counterBtn = document.getElementById('counter-btn');
    const countNumber = document.getElementById('count-number');
    const resetBtn = document.getElementById('reset-btn');
    const minusBtn = document.getElementById('minus-btn');
    const plusBtn = document.getElementById('plus-btn');

    // Init from Local Storage
    const savedCount = localStorage.getItem('tap_counter_value');
    if (savedCount !== null) {
      count = parseInt(savedCount, 10);
      updateDisplay(false); // don't animate initial load
    }

    // Render initial declaration
    renderDeclaration();

    // Declaration Manager Functions
    function renderDeclaration() {
      const decSection = document.getElementById('declaration-section');
      if (declaration) {
        decSection.innerHTML = `
          <div class="declaration-display-wrapper">
            <span class="declaration-title">Today's Declaration</span>
            <p class="declaration-text">"${declaration}"</p>
            <button id="edit-dec-btn" class="edit-dec-btn">Edit</button>
          </div>
        `;
        document.getElementById('edit-dec-btn').addEventListener('click', () => {
          decSection.innerHTML = getDeclarationInputHTML(declaration);
          attachInputListeners();
        });
      } else {
        decSection.innerHTML = getDeclarationInputHTML('');
        attachInputListeners();
      }
    }

    function getDeclarationInputHTML(initialValue) {
      return `
        <div class="declaration-input-wrapper">
          <span class="declaration-title">What are you declaring today?</span>
          <input id="declaration-input" type="text" class="declaration-input" placeholder="Type your declaration here..." value="${initialValue.replace(/"/g, '&quot;')}">
          <button id="save-dec-btn" class="save-dec-btn">Save Declaration</button>
        </div>
      `;
    }

    function attachInputListeners() {
      const saveBtn = document.getElementById('save-dec-btn');
      const decInput = document.getElementById('declaration-input');
      
      const saveAction = () => {
        declaration = decInput.value.trim();
        if (declaration) {
          localStorage.setItem('tap_counter_declaration', declaration);
        } else {
          localStorage.removeItem('tap_counter_declaration');
        }
        renderDeclaration();
      };

      saveBtn.addEventListener('click', saveAction);
      decInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          saveAction();
        }
      });
    }

    // Function to update display
    function updateDisplay(animate = true) {
      countNumber.innerText = count;
      localStorage.setItem('tap_counter_value', count);

      if (animate) {
        // Pop scaling animation
        countNumber.style.transform = 'scale(1.12)';
        setTimeout(() => {
          countNumber.style.transform = 'scale(1)';
        }, 120);
      }
    }

    // Perform tap increment
    function handleTap(e) {
      count++;
      updateDisplay(true);
      
      // Visual feedback: Ripple & Floating bubble
      createRipple(e);
      createFloatingBubble(e, '+1');

      // Visual feedback state
      counterBtn.classList.add('active');
      setTimeout(() => counterBtn.classList.remove('active'), 80);
    }

    // Ripple effect generator
    function createRipple(e) {
      const rect = counterBtn.getBoundingClientRect();
      let clientX, clientY;

      // Check if TouchEvent or PointerEvent
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      
      // Size calculation based on container
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.marginLeft = ripple.style.marginTop = `${-size / 2}px`;

      counterBtn.appendChild(ripple);
      
      // Cleanup
      ripple.addEventListener('animationend', () => {
        ripple.remove();
      });
    }

    // Floating text feedback generator
    function createFloatingBubble(e, text) {
      const bubble = document.createElement('div');
      bubble.className = 'floating-bubble';
      bubble.innerText = text;

      // Handle position
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      // Append to body to bypass overflow hidden of button
      bubble.style.left = `${clientX}px`;
      bubble.style.top = `${clientY}px`;

      document.body.appendChild(bubble);

      bubble.addEventListener('animationend', () => {
        bubble.remove();
      });
    }

    // Event Listeners for Counter Button (Optimized for no lag)
    const isTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0);
    const triggerEvent = isTouch ? 'touchstart' : 'mousedown';

    counterBtn.addEventListener(triggerEvent, (e) => {
      e.preventDefault(); // Prevents zoom, scroll, double-tap delay
      handleTap(e);
    });

    // Control buttons listeners
    plusBtn.addEventListener('click', (e) => {
      count++;
      updateDisplay(true);
      createFloatingBubble(e, '+1');
    });

    minusBtn.addEventListener('click', (e) => {
      if (count > 0) {
        count--;
        updateDisplay(true);
        createFloatingBubble(e, '-1');
      }
    });

    resetBtn.addEventListener('click', () => {
      if (count === 0) return;
      
      const confirmReset = confirm('Are you sure you want to reset the counter back to 0?');
      if (confirmReset) {
        count = 0;
        updateDisplay(true);
      }
    });

    // Fetch live statistics
    async function loadStats() {
      try {
        // 1. Increment page views
        await fetch('/api/counter/increment', { method: 'POST' });
        
        // 2. Fetch stats
        const res = await fetch('/api/counter/stats');
        if (res.ok) {
          const stats = await res.json();
          document.getElementById('stats-views').innerText = stats.pageViews.toLocaleString();
        }
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    // Run on load
    loadStats();

  </script>
</body>
</html>
